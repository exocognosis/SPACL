name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo doc --no-deps --locked
      - run: cargo run --locked -- --help
      - run: cargo run --locked -- audit --help
      - name: Run three-robot demo
        run: cargo run --locked -- --no-color demo --output target/ci-demo --watch
      - name: Verify coordinator audit
        run: >-
          cargo run --locked -- audit verify
          --audit target/ci-demo/coordinator/audit.jsonl
          --public-identity target/ci-demo/coordinator/coordinator.public.json
      - name: Upload demo audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacl-demo-audits
          path: target/ci-demo/**/audit.jsonl
          if-no-files-found: error
          retention-days: 14

