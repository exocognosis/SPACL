[package]
name = "spacl"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Secure Physical Agent Coordination Layer"
repository = "https://github.com/exocognosis/SPACL"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.0"
dirs = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
ml-dsa = { version = "0.1.1", features = ["getrandom", "zeroize"] }
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace", "request-id", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
